[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/scanner",
    "crates/storage",
    "crates/duplicates",
    "apps/cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
publish = false

[workspace.dependencies]
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
directories = "5"
mac-storage-common = { path = "crates/common" }
mac-storage-duplicates = { path = "crates/duplicates" }
mac-storage-scanner = { path = "crates/scanner" }
mac-storage-storage = { path = "crates/storage" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"
